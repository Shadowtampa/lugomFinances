apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: lugom-financas
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgrest}
  template:
    metadata:
      labels: {app: postgrest}
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          env:
            - name: AUTHENTICATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: lugom-financas, key: authenticator-password}}
            - {name: PGRST_DB_URI, value: "postgres://authenticator:$(AUTHENTICATOR_PASSWORD)@postgres:5432/lugom"}
            - {name: PGRST_DB_SCHEMAS, value: public}
            - {name: PGRST_DB_ANON_ROLE, value: anon}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: lugom-financas, key: jwt-secret}}
            - {name: PGRST_SERVER_PORT, value: "3000"}
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: lugom-financas
spec:
  selector: {app: postgrest}
  ports:
    - port: 3000
