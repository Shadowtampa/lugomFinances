server {
    listen 80;
    root /usr/share/nginx/html;

    # Nome resolvido a cada requisição (resolver + variável), não na subida: se o DNS do
    # cluster piscar, o nginx não cai em loop; a requisição só dá 502 e a próxima funciona.
    resolver 10.96.0.10 valid=30s ipv6=off;
    set $postgrest postgrest.lugom-financas.svc.cluster.local;
    set $worker worker.lugom-financas.svc.cluster.local;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # M20: "Sincronizar agora" -> worker da Pluggy (valida o JWT do login).
    location = /sync {
        proxy_pass http://$worker:8080/sync;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # index.html sem cache: cada build novo aparece no próximo F5.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: rotas do React Router caem no index.html.
    location / {
        try_files $uri /index.html;
    }
}
