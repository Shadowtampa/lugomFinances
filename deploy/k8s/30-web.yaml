# nginx: serve o build (dist/ do repositório, via hostPath) e repassa /api/ ao PostgREST.
# Publicado direto na porta 10070 do host (hostPort; NodePort só aceita 30000+).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lugom-financas
spec:
  replicas: 1
  strategy:
    type: Recreate   # hostPort: dois pods não cabem na mesma porta
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {containerPort: 80, hostPort: 10070}
          volumeMounts:
            - {name: dist, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
      volumes:
        - name: dist
          hostPath: {path: /home/luisgomes/dev/homelab/lugom/lugomFinances/dist, type: Directory}
        - name: conf
          configMap: {name: web-nginx}
