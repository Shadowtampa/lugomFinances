# Postgres. Dados em hostPath (o cluster não tem StorageClass).
# Na primeira subida roda db/migrations + db/zz_settings.sh (ConfigMap db-init, criado pelo subir.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lugom-financas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_DB, value: lugom}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: lugom-financas, key: postgres-password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: lugom-financas, key: jwt-secret}}
            - name: AUTHENTICATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: lugom-financas, key: authenticator-password}}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "lugom"]}
            periodSeconds: 5
          volumeMounts:
            - {name: dados, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: dados
          hostPath: {path: /var/lib/lugom-financas/postgres, type: DirectoryOrCreate}
        - name: init
          configMap: {name: db-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lugom-financas
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
